[versions]
agp = "8.12.3"
junit = "4.13.2"
kmpnotifierLocal = "2.0.0"
kotlin = "2.2.20"
android-minSdk = "24"
android-compileSdk = "36"
lifecycleProcess = "2.10.0"
robolectric = "4.16.1"
vanniktechMavenPublish = "0.34.0"
media3 = "1.10.0"
compose = "1.10.3"
compose-material3 = "1.10.0-alpha05"
androidx-activity = "1.10.1"
turbine = "1.2.1"
kotlinx-coroutines = "1.11.0"
kotlinx-browser = "0.3"
gstreamer = "1.4.0"
# Pinned deliberately, on two constraints:
#  - 0.14+ stopped publishing iosX64, which :sample declares.
#  - 0.13.0 depends on kotlinx-io 0.9.0, whose klibs are built with Kotlin 2.3 and
#    drag kotlin-stdlib to 2.3.x. The wasmJs and iOS compilers here run 2.2.20 and
#    reject a newer stdlib klib outright ("Missing stdlib class"); the JVM and
#    Android targets do not, so this only shows up on the klib targets.
# 0.12.0 is built with Kotlin 2.2.20 and stays on kotlinx-io 0.8.0.
filekit = "0.12.0"
jna = "5.19.1"

[libraries]
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleProcess" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleProcess" }
junit = { module = "junit:junit", version.ref = "junit" }
kmpnotifier-local = { module = "io.github.mirzemehdi:kmpnotifier-local", version.ref = "kmpnotifierLocal" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }


kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Supplies Dispatchers.Main on the JVM, backed by the Swing EDT. Same version ref as
# -core on purpose: the two are checked against each other at runtime.
kotlin-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
# org.w3c.dom bindings for wasmJs; they are no longer in the stdlib.
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
# Desktop playback. Java bindings only — the GStreamer natives must be present
# on the machine (brew install gstreamer / apt install libgstreamer1.0 / MSI).
gstreamer = { module = "org.freedesktop.gstreamer:gst1-java-core", version.ref = "gstreamer" }
# Multiplatform file picker, used by :sample to load local media. A sample-only
# dependency — the library itself never picks files.
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
# Desktop native video. Declared explicitly rather than leaned on transitively
# through gst1-java-core, which also pulls JNA in.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

# Compose Multiplatform (JetBrains) artifacts
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
# rememberSaveable, for PlayerUiStateHolder surviving config changes / process death.
compose-runtime-saveable = { module = "org.jetbrains.compose.runtime:runtime-saveable", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
# The multiplatform @Preview annotation (annotations only — no renderer).
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
# The preview renderer. Android-only, and only needed so the IDE can draw them.
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }





robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
# Compose compiler plugin (required for @Composable usage)
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }


[bundles]
test = ["kotlin-coroutines-test", "turbine"]